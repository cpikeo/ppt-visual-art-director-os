# eval 02 · 整册叙事：建立 → 证据 → 收束
audience: "董事会，季度经营会"
decision: "批准下一财年把补贴预算的三成转投履约能力"
tension: "过去两年靠补贴拉新，董事会担心停补贴就掉量"
slides:
  - id: s01
    title: "补贴换来的增长，正在被履约短板吃掉"
    content: "2024 年新增用户 128 万，其中 61% 在首单后 90 天内流失。（来源：增长台账）"
  - id: s02
    title: "复购率三年翻倍，靠的是履约不是补贴"
    content: "2022 年 21%，2023 年 33%，2024 年 44%；同期补贴率从 8% 降到 3%。（来源：门店台账）"
  - id: s03
    title: "履约每快一天，30 天复购提高 6 个点"
    content: "12 城 A/B：次日达组 30 天复购 44%，三日达组 38%。（来源：运营实验 2024-Q3）"
  - id: s04
    title: "三个环节卡住了时效"
    content: "拣货动线、干线频次、末端站点密度；其中末端站点密度是唯一未达标的环节。"
  - id: s05
    title: "同行已经把履约当成产品在做"
    content: "对比：头部两家次日达占比 87% 与 82%，我们 68%。（来源：公开财报与门店走访）"
  - id: s06
    title: "请批准把三成补贴转投履约"
    content: "预算重配 1.2 亿元；预期 12 个月内次日达占比 68% → 85%。（来源：财务测算）"
