  title: 门店回访：复购发生在收货后第三天
  content: 2024 年走访 12 家门店，店员反馈复购集中在收货后 48 到 72 小时；样本 36 单
- id: s03
  title: 三类成本结构
  content: 履约成本 11.2 元，营销成本 4.1 元，履约成本占总成本 61%
- id: s04
  title: 下一步
  content: 请批准 800 万元用于长三角仓配扩容，2025 年 Q3 前完成
