name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 必须进矩阵：渲染链探测、路径归一化、profile URI 这几条
        # 都是平台相关分支，只在 Linux 上跑等于没测到最容易坏的地方。
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install package (editable, exposes the flat script modules)
        run: python -m pip install -e .

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      - name: Regression suite
        # selftest 全 PASS 退 0、任一 FAIL 退 1，退出码本身即门槛。
        # 它不需要 LibreOffice：缺渲染器时相关用例自行降级，不会误报失败。
        run: python scripts/selftest.py
        env:
          PYTHONPATH: scripts

      - name: Whitespace check
        if: matrix.os == 'ubuntu-latest'
        run: git diff --check

  smoke:
    name: spec 档冒烟（零渲染 / 零 python-pptx）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Plan a deck from a brief (R1)
        run: python scripts/pipeline.py templates/design_brief.yml --out /tmp/plan.json --json > /dev/null

      - name: Confirm spec mode stays free of python-pptx (v3.2 红线)
        run: |
          python - <<'PY'
          import subprocess, sys, textwrap, pathlib, tempfile
          spec = textwrap.dedent('''
              SPEC = {"canvas": {"width": 1280, "height": 720},
                      "theme": {"colors": {"background": "#FFFFFF", "ink": "#111111",
                                           "muted": "#777777", "primary": "#222222",
                                           "secondary": "#333333", "accent": "#AA0000"}},
                      "slides": [{"id": "s01",
                                  "source_zone": {"x": 48, "y": 664, "width": 1184, "height": 40},
                                  "page_intent": {"insight": "A", "focus": "t", "density": "sparse",
                                                  "energy": "high", "empty_space_role": "hold_emotion"},
                                  "elements": [{"type": "text", "id": "t", "x": 400, "y": 300,
                                                "width": 480, "height": 120, "size": 48, "text": "A",
                                                "color": "ink", "max_lines": 1, "line_height": 1.2}]}]}
          ''')
          d = pathlib.Path(tempfile.mkdtemp())
          build = d / "build_probe.py"
          build.write_text(spec, encoding="utf-8")
          code = (
              "import sys; sys.path.insert(0, 'scripts')\n"
              "import importlib.util as iu, qa\n"
              f"m = iu.spec_from_file_location('b', r'{build}')\n"
              "mod = iu.module_from_spec(m); m.loader.exec_module(mod)\n"
              "r = qa.run_qa(mod.SPEC, r'%s', mode='spec', render_dir=r'%s')\n"
              "bad = sorted({n for n in sys.modules if n.split('.')[0] in "
              "{'pptx','lxml','compiler','render_check','numpy'}})\n"
              "print('RESULT', bad, r['status'])\n"
              "assert not bad, bad\n"
          ) % (d / "spec.pptx", d / "render")
          out = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          print(out.stdout, out.stderr)
          sys.exit(out.returncode)
          PY
