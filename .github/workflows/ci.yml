name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 必须进矩阵：路径归一化、字体回落、缓存 marker 这几条
        # 都是平台相关分支，只在 Linux 上跑等于没测到最容易坏的地方。
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install package (editable, exposes the flat script modules)
        run: python -m pip install -e .

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      - name: Regression suite
        # selftest 全 PASS 退 0、任一 FAIL 退 1，退出码本身即门槛。
        # 它不需要 LibreOffice：缺渲染器时相关用例自行降级，不会误报失败。
        run: python scripts/selftest.py
        env:
          PYTHONPATH: scripts

      - name: Whitespace check
        if: matrix.os == 'ubuntu-latest'
        run: git diff --check

  smoke:
    name: spec 档冒烟（零渲染 / 零 python-pptx）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Plan a deck from a brief (THINK)
        run: python scripts/vao.py plan templates/brief.yml --out /tmp/plan.json

      - name: Confirm spec mode stays free of python-pptx (红线)
        # 唯一入口 vao.py check --mode spec：判定但不编译。
        # 断言 pptx / lxml / compiler 不进 sys.modules——spec 档在无渲染依赖的
        # 环境必须可用；这条红线由 selftest 的 CLI 组与这里的冒烟双重锁定。
        run: |
          python - <<'PY'
          import subprocess, sys, textwrap, pathlib, tempfile
          spec = textwrap.dedent('''
              SPEC = {"canvas": {"width": 1280, "height": 720},
                      "theme": {"colors": {"background": "#FFFFFF", "ink": "#111111",
                                           "muted": "#777777", "primary": "#222222",
                                           "secondary": "#333333", "accent": "#AA0000"},
                                "fonts": {"cn": "Source Han Sans SC", "latin": "Arial"}},
                      "slides": [{"id": "s01",
                                  "source_zone": {"x": 48, "y": 664, "width": 1184, "height": 40},
                                  "page_intent": {"insight": "A", "focus": "t"},
                                  "elements": [{"type": "text", "id": "t", "x": 400, "y": 300,
                                                "width": 480, "height": 120, "size": 48, "text": "A",
                                                "color": "ink", "max_lines": 1, "line_height": 1.2}]}]}
          ''')
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "build_probe.py").write_text(spec, encoding="utf-8")
          code = (
              "import sys; sys.path.insert(0, 'scripts')\n"
              "from vao import run_check\n"
              f"run_check(r'{d / 'build_probe.py'}', r'{d / 'spec.pptx'}', mode='spec',\n"
              "          json_output=True)\n"
              "bad = sorted({n for n in sys.modules if n.split('.')[0] in "
              "{'pptx','lxml','compiler'}})\n"
              "print('FORBIDDEN MODULES:', bad)\n"
              "assert not bad, bad\n"
          )
          out = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          print(out.stdout, out.stderr)
          sys.exit(out.returncode)
          PY
