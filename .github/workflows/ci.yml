name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  selftest:
    name: selftest · ${{ matrix.os }} · py${{ matrix.python }} · ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 必须进矩阵：路径归一化、字体回落、缓存 marker 这几条
        # 都是平台相关分支，只在 Linux 上跑等于没测到最容易坏的地方。
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        dependencies: [latest]
        include:
          - os: ubuntu-latest
            python: "3.10"
            dependencies: minimum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check declared dependency lower bounds
        if: matrix.dependencies == 'minimum'
        run: python -m pip install "python-pptx==1.0.2" "Pillow==10.0.0" "numpy==1.24.0" "PyYAML==6.0"

      - name: Install package (editable, exposes the flat script modules)
        run: python -m pip install -e .

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      - name: Regression suite
        # selftest 全 PASS 退 0、任一 FAIL 退 1，退出码本身即门槛。
        # 不依赖任何外部渲染器或 Office 软件。
        run: python scripts/selftest.py
        env:
          PYTHONPATH: scripts

      - name: Judgment regression (all 57 cases; failure exits nonzero)
        run: python scripts/bench.py

      - name: Frozen generalization regressions
        run: |
          python - <<'PYTEST'
          import pathlib, subprocess, sys
          # r5 是 P2 的判断回归集（跨指标凑和、真分解、时间点、否定谓语、量词完整）。
          # 新增冻结集必须同时登记在这里：只加文件不登记 = 没人跑。
          required = {"generalization_cases.json", "generalization_cases_r2.json",
                      "generalization_cases_r3.json", "generalization_cases_r4.json",
                      "generalization_cases_r5.json", "generalization_cases_r6.json"}
          found = {p.name for p in pathlib.Path("scripts/json").glob("generalization_cases*.json")}
          missing = required - found
          if missing:
              sys.exit("Missing frozen suites: " + ", ".join(sorted(missing)))
          for cases in sorted(pathlib.Path("scripts/json").glob("generalization_cases*.json")):
              subprocess.run([sys.executable, "scripts/unseen_bench.py", "--cases", str(cases)], check=True)
          PYTEST
        shell: bash

      - name: 判据守门审计（每条 policy 判据都必须有案例守着）
        # 把判据调坏 → 谁变红。零报警的判据是覆盖缺口，不能算「没问题」；
        # 这也是删案例前的必查项：只有零守卫的案例才可能被合并。
        run: python scripts/bench.py --guard-audit --cases scripts/json/generalization_cases_r6.json

      - name: Whitespace check
        if: matrix.os == 'ubuntu-latest'
        run: git diff --check

  smoke:
    name: spec 档冒烟（零渲染 / 零 python-pptx）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Plan a deck from a brief (THINK)
        run: python scripts/vao.py plan templates/brief.yml --out /tmp/plan.json

      - name: 数据契约（plan.schema.json + 策略覆盖）
        # 两条红线：plan 落盘产物必须通过结构 + 语义契约；策略覆盖写错键必须报错，
        # 而不是静默按默认值跑。此处独立于 selftest，防止契约只在单测里被覆盖。
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, tempfile
          sys.path.insert(0, "scripts")
          from schema import load, validate
          import intelligence as intel
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "b.yml").write_text(
              "audience: 董事会\ndecision: 批准预算\ntension: 现金流\n"
              "slides:\n  - id: s01\n    title: 复购率三年翻倍靠履约\n"
              "    content: 2022 年 21%；2023 年 33%；2024 年 44%\n", encoding="utf-8")
          out = d / "plan.json"
          subprocess.run([sys.executable, "scripts/vao.py", "plan", str(d / "b.yml"),
                          "--out", str(out)], check=True)
          schema_path = pathlib.Path("schemas/plan.schema.json")
          problems = validate(json.loads(out.read_text(encoding="utf-8")), load(schema_path))
          problems += intel.validate_plan(json.loads(out.read_text(encoding="utf-8")))
          assert not problems, problems
          (d / "bad_policy.json").write_text('{"measure": {"max_cjk_typo": 40}}',
                                             encoding="utf-8")
          bad = subprocess.run([sys.executable, "scripts/vao.py", "plan", str(d / "b.yml"),
                                "--out", str(d / "p2.json"),
                                "--policy", str(d / "bad_policy.json")],
                               capture_output=True, text=True, encoding="utf-8")
          assert bad.returncode == 2, (bad.returncode, bad.stdout, bad.stderr)
          # 输入契约：写错一个键名必须当场拦下（audiance → audience），
          # 而不是让整份稿的受众静默变成 None。
          (d / "bad_brief.yml").write_text(
              "audiance: 董事会\\ndecision: 批准预算\\nslides:\\n"
              "- id: s01\\n  title: 复购率翻倍\\n  conten: 2022 年 21%\\n",
              encoding="utf-8")
          typo = subprocess.run([sys.executable, "scripts/vao.py", "plan",
                                 str(d / "bad_brief.yml"), "--out", str(d / "p3.json")],
                                capture_output=True, text=True, encoding="utf-8")
          assert typo.returncode == 2, (typo.returncode, typo.stdout, typo.stderr)
          assert not (d / "p3.json").exists()
          # 契约漂移：真实产出物里不得出现契约没声明的字段（本轮之前的实测缺口）
          from schema import contract_gaps, contract_path
          plan_doc = json.loads(out.read_text(encoding="utf-8"))
          gaps = contract_gaps(plan_doc, __import__("schema").load(
              contract_path("plan.schema.json", required=True)))
          assert not gaps, gaps[:3]
          print("contract ok")
          PY

      - name: Confirm spec mode stays free of python-pptx (红线)
        # 唯一入口 vao.py check --mode spec：判定但不编译。
        # 断言 pptx / lxml / compiler 不进 sys.modules——spec 档在无渲染依赖的
        # 环境必须可用；这条红线由 selftest 的 CLI 组与这里的冒烟双重锁定。
        run: |
          python - <<'PY'
          import subprocess, sys, textwrap, pathlib, tempfile
          spec = textwrap.dedent('''
              SPEC = {"canvas": {"width": 1280, "height": 720},
                      "theme": {"colors": {"background": "#FFFFFF", "ink": "#111111",
                                           "muted": "#777777", "primary": "#222222",
                                           "secondary": "#333333", "accent": "#AA0000"},
                                "fonts": {"cn": "Source Han Sans SC", "latin": "Arial"}},
                      "slides": [{"id": "s01",
                                  "source_zone": {"x": 48, "y": 664, "width": 1184, "height": 40},
                                  "page_intent": {"insight": "A", "focus": "t"},
                                  "elements": [{"type": "text", "id": "t", "x": 400, "y": 300,
                                                "width": 480, "height": 120, "size": 48, "text": "A",
                                                "color": "ink", "max_lines": 1, "line_height": 1.2}]}]}
          ''')
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "build_probe.py").write_text(spec, encoding="utf-8")
          code = (
              "import sys; sys.path.insert(0, 'scripts')\n"
              "from vao import run_check\n"
              f"run_check(r'{d / 'build_probe.py'}', r'{d / 'spec.pptx'}', mode='spec',\n"
              "          json_output=True)\n"
              "bad = sorted({n for n in sys.modules if n.split('.')[0] in "
              "{'pptx','lxml','compiler'}})\n"
              "print('FORBIDDEN MODULES:', bad)\n"
              "assert not bad, bad\n"
          )
          out = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          print(out.stdout, out.stderr)
          sys.exit(out.returncode)
          PY
