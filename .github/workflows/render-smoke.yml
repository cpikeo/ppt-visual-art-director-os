name: render-smoke

# 渲染冒烟：把「guard 报的行数 / 预览折行 / LibreOffice 真排」三者的分歧变成
# 每个提交都能看见的门槛。此前这类对拍只在作者本地手工跑过一次（128 探针），
# 之后没有任何机制阻止它漂回去——字体换了、余量调了、折行改了，CI 全是绿的。
#
# 门槛（两条）：
#   1) guard 低估数必须为 0 —— 低估 = 放行一个会溢出的框，是这类错误里最坏的；
#   2) ghost 不一致数不超过已知上限（默认 2，都是 ≤9 字/行的极窄栏；棘轮，
#      多一个就红）。高估是安全方向，只报告不拦。
#
# 依赖 LibreOffice + Noto CJK + poppler：只在 nightly 与相关路径变更时跑，
# 不进每次 PR 的必跑矩阵（`ci.yml` 的 selftest 不需要任何外部渲染器）。

on:
  schedule:
    - cron: "0 18 * * *"          # 03:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tools/metrics_calibration.py"
      - ".github/workflows/render-smoke.yml"

concurrency:
  group: render-smoke
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  smoke:
    name: 三度量对拍 · 32 探针
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install renderer (LibreOffice + poppler + Noto CJK)
        # 版本写进日志：换渲染器等于换仲裁者，回归数字必须能对上当时的版本。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk
          soffice --version
          pdftotext -v 2>&1 | head -1
          fc-list | grep -c "CJK SC" || true

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 三度量冒烟（guard 低估必须为 0）
        run: python tools/metrics_calibration.py --smoke --scripts scripts --out smoke.json

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-${{ github.run_id }}
          path: smoke.json
          if-no-files-found: warn
          retention-days: 30
