# Design Brief —— 唯一的需求契约（人写给技能包的一页纸）
#
# 纪律：
#   1. 写了的字段原样生效（逐页声明 > deck 级 > 品牌 > direction > Skill 判断 > 兜底）。
#   2. 没写的字段不猜。deck 级判断缺失 → brief.unresolved；证据型页缺 content →
#      plan.warnings（unresolved_content）。title 不能代替 content。
#   3. Skill 负责判断/编排/验证，不替用户虚构需求。
#
# 执行：python scripts/vao.py run <brief> --plan-out plan.json --skeleton build_deck.py \
#          --assets-out asset_manifest.json --assets-dir generated_assets
#       出图后：python scripts/vao.py check build_deck.py out.pptx --mode release \
#          --assets-manifest asset_manifest.json

# ============================================================
# 01 · 核心契约
# ============================================================

audience: ""            # 谁看 + 什么场景（例：投资机构与战略伙伴，现场路演 + 异步阅读）
decision: ""            # 看完希望支持的唯一决定（动词 + 对象，例：推进本轮融资）
tension: ""             # 观众当前最大的疑问/风险/阻力——只写张力，不写解决方案

# ============================================================
# 02 · 页面叙事（family 决定页面家族；显式声明不被节奏判断改写）
# ============================================================

slides:
  - id: s01
    family: cover       # cover|statement|data|comparison|case|process|timeline|
                        # architecture|business|agenda|brand_story|product|closing
    title: ""
    content: ""
    # density: sparse   # sparse|balanced|dense（写了锁定）
    # energy: medium    # low|medium|high
    # 逐页视觉声明写在本条目内，字段见 03。
  - id: s02
    family: statement
    title: ""
  - id: s03
    family: data
    title: ""
    content: ""         # 证据型家族（data/comparison/case/business/timeline）必填；
                        # 留空 → unresolved_content。不得由 title 脑补数据；
                        # 正确处理：补证据 / 改为观点页 / 删除该页。

# ============================================================
# 03 · 逐页视觉声明（已声明即权威，不被 direction/quality_level 覆盖）
# ============================================================
# Asset Decision ≠ 填图。判断顺序固定四步：
#   1) 需要视觉资产？ → asset
#   2) 建立空间 or 表达对象？ → asset_role: background | illustration | hybrid
#   3) 为什么存在？ → asset_function: hero|proof|emotion|context|frame|separate
#   4) 画面出现什么？ → asset_subject / material / lighting / texture
#   最后才决定生成 / 复用 / 原生表达。两轴不互相推导：background ≠ hero，
#   illustration ≠ 必须 hero；不发明组合枚举。
#
# asset: required       # required|reuse|none
#   required ≠ 必须做主体图：整幅背景/局部插图/主视觉/环境照片由 role+function 决定。
#   看到 required 就自动出图塞页面＝本包禁止的做法。none＝明确禁图。
#   asset_subject 非空等价 asset=required（显式声明，不被默认策略覆盖）。
# asset_role: background   # background＝空间/氛围/材质/光/负空间（须能与文字共存，
#                          # 不制造主角）；illustration＝对象/叙事/符号（允许明确主体，
#                          # 禁止无意义装饰与数据代偿）。未声明 → Skill 判断并留痕 assumed。
# asset_subject: "a celadon tea bowl at right, empty space on the left for text"
#   画面「出现什么」（建议英文）。background 写空间/材质/光线/氛围；
#   illustration 写可独立识别的对象。Skill 不得凭 title 脑补对象。
# medium: photography   # 逐页工艺纪律（摄影→写实；水墨→水墨），不由 deck 级继承。
# asset_ratio: "16:9"   # 16:9|4:3|3:2；比例不符需裁切时显式 asset_allow_crop: true
# asset_function: hero  # hero/proof＝具象主体，严查裁切、不注入运动模糊；
#                       # emotion/context/frame/separate＝边界由材质光线承担。
# negative_space_anchor: left   # left|right|top|bottom｜center，文字安全区主落点。
# safe_area: {x: 0.06, y: 0.08, width: 0.34, height: 0.78}
#   仅精确指定时写。版面不压文字（整幅画心/栏内插图）写 safe_area: {}——
#   没有文字压图就没有安全区，相关句式与检查一并停用。
# text_color: dark      # dark|light，QC 按实际亮度验证。
# material: "rice paper ground, ink wash gradient"   # 自然语言材质，不写设计模板
# lighting: "single soft north window light from the upper left, gentle falloff"
#   逐页光照声明：direction/medium 默认光不得覆盖。
# texture: [handmade rice paper fiber]   # 或族键：eastern|luxury|architecture|technology|organic
# asset_color: ["ink tonal range of three to four values"]
# negative: ["saturated red sun"]        # 并入该页 negative；deck 级 avoid 同样并入。
# 既有素材跳过生成，不跳过登记 + QC：
# asset_source: {kind: provided, path: "images/tea.jpg", source: "用户提供；授权待核实"}
#   kind：provided|licensed|original|reuse。
#   v7.0.0：prepare 时字节已存在的规划资产会被自动如实登记为 existing（保留规划身份），
#   无须人工补登记。

# ============================================================
# 04 · Deck 级视觉世界（永远低于逐页显式声明）
# ============================================================

visual_world: ""        # 一句话：材质 + 光影 + 空间。禁止在此声明 medium
                        # （medium 属逐页资产属性，deck 级会把介质强加全 deck）。
composition_grammar: "" # soft_asymmetry|strict_grid|cinematic_stage|evidence_field|path_sequence
background_scene: ""    # solid_world|atmospheric|cinematic —— 整副 deck 的页面背景世界；
                        # 「这页有没有背景图」是逐页 asset 的事，四者职责不混淆。
avoid: []               # 明确不要的视觉语言，进入相关资产 negative。

# ============================================================
# 05 · 品牌（品牌色优先于 direction seed）
# ============================================================
# 列表写法按惯例序：1=主色 2=强调 3=辅；字典写法精确指定槽位
# （background/paper=纸面，ink/primary=墨色）。仅 #RGB/#RRGGBB。
brand_colors: []

# ============================================================
# 06 · 视觉方向（起点，不是模板；无法识别回落 quiet_minimal 并留痕）
# ============================================================
# 结构预设：quiet_minimal / editorial_brand / product_stage / evidence_first
# 色彩·世界族：song_elegance / zen_minimal / luxury_editorial / nordic_quiet /
#   quiet_luxury / monochrome_noir / cinematic_narrative / nature_luxury /
#   organic_systems / precision_tech / precision_minimal / data_intelligence /
#   editorial_intelligence
design_direction: ""

# ============================================================
# 07 · 质量等级（判断与证据预算，不是审美等级）
# ============================================================
quality_level: ""       # fast（默认）| advanced。不改变用户声明、内容、意图；
                        # advanced ≠ 更多图片/装饰/复杂布局——纯排版页仍然纯排版。
